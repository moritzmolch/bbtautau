#
# Configuration file of the law workflow
#

[modules]

bbtautau.tasks.xsec_friends
bbtautau.tasks.shapes
bbtautau.tasks.control_plots


[luigi_core]

local_scheduler = True
no_lock = True


[luigi_worker]

keep_alive = True
ping_interval = 20
wait_interval = 20
max_reschedules = 0


[luigi_scheduler]

retry_count = 0


[logging]

law: INFO
luigi-interface: INFO
gfal2: WARNING


[wlcg_fs_gridka]

base = davs://cmsdcache-kit-disk.gridka.de:2880/pnfs/gridka.de/cms/disk-only/store/user/${USER}
use_cache = True
cache_root = /tmp/${USER}
cache_max_size = 20GB
cache_global_lock = True
retries = 3
retry_delay = 20
